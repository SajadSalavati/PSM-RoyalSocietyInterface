# Experiment: OSI field, Sten model, Wall region.
# This single file replaces the hand-edited constants of the original
# Code_*.ipynb notebook. Run with:
#   python -m psm_surrogate.cli --config configs/sten_wall_osi.yaml --stage all
name: sten_wall_osi
model: Sten
bc_name: Wall
variable_name: OSI

field_key: osi
npz_filename: "rylScty_patientSpec_StenosisModel_wallPre&OSI&WSS.npz"
