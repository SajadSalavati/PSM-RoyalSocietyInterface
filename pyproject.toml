[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psm-surrogate"
version = "0.1.0"
description = "POD + LSTM surrogate model of blood hemodynamics for patient-specific carotid artery stenosis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sajad Salavatidezfouli" }]
keywords = ["POD", "LSTM", "reduced-order-model", "hemodynamics", "CFD", "surrogate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "PyYAML>=5.4",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "scikit-learn>=1.0",
    "torch>=1.10",
    "tqdm>=4.62",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/SajadSalavati/PSM-RoyalSocietyInterface"
Paper = "https://royalsocietypublishing.org/journal/rsif"

[project.scripts]
psm-surrogate = "psm_surrogate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
# Research notebooks are kept verbatim as historical artifacts; don't lint them.
extend-exclude = ["notebooks", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
